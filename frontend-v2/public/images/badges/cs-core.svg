<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="csGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="csShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1808" />
      <stop offset="100%" stop-color="#110d02" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0f0c05" stroke="url(#csGold)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#csGold)" fill-opacity="0.15" />

  <!-- Distinction Crest Shield -->
  <path d="M40 38 h40 v24 c0 16 -18 24 -20 25 c-2 -1 -20 -9 -20 -25 z" fill="url(#csShield)" stroke="url(#csGold)" stroke-width="2.5" />

  <!-- Four Pillars Quad Diamonds -->
  <!-- Pillar 1: Top (Fundamentals) -->
  <polygon points="60,44 64,48 60,52 56,48" fill="#38bdf8" />
  <!-- Pillar 2: Right (Java) -->
  <polygon points="70,54 74,58 70,62 66,58" fill="#f97316" />
  <!-- Pillar 3: Bottom (DBMS) -->
  <polygon points="60,64 64,68 60,72 56,68" fill="#34d399" />
  <!-- Pillar 4: Left (OS) -->
  <polygon points="50,54 54,58 50,62 46,58" fill="#a78bfa" />

  <!-- Center Golden Crown Star -->
  <circle cx="60" cy="58" r="4" fill="#ffffff" filter="url(#csGlow)" />
</svg>
