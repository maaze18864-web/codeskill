<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="agentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#140f17" stroke="url(#agentBg)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#agentBg)" fill-opacity="0.14" />
  <!-- Agent ReAct Graph Loop Arrows -->
  <path d="M 60 32 A 28 28 0 0 1 88 60 A 28 28 0 0 1 60 88 A 28 28 0 0 1 32 60 A 28 28 0 0 1 54 32.5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 4" stroke-linecap="round" />
  <polygon points="58,28 66,33 58,38" fill="#fbbf24" />
  <!-- Agent Nodes (Planner, Tool, Critic) -->
  <circle cx="60" cy="32" r="5.5" fill="#f59e0b" filter="url(#agentGlow)" />
  <circle cx="88" cy="60" r="5.5" fill="#ef4444" filter="url(#agentGlow)" />
  <circle cx="60" cy="88" r="5.5" fill="#8b5cf6" filter="url(#agentGlow)" />
  <circle cx="32" cy="60" r="5.5" fill="#10b981" filter="url(#agentGlow)" />
  <!-- Central Brain / Controller -->
  <circle cx="60" cy="60" r="10" fill="url(#agentBg)" />
  <circle cx="60" cy="60" r="4" fill="#ffffff" />
</svg>
