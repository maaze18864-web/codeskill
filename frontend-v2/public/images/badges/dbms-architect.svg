<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="dbmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="dbmsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#080c14" stroke="url(#dbmsBg)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#dbmsBg)" fill-opacity="0.12" />

  <!-- Top Cylinder Disc -->
  <g fill="none" stroke="url(#dbmsBg)" stroke-width="2.5" stroke-linecap="round">
    <ellipse cx="60" cy="38" rx="26" ry="9" fill="#0c1829" />
    <!-- Middle Cylinder Ring -->
    <path d="M34 38 v14 c0 5 11.6 9 26 9 s26 -4 26 -9 v-14" />
    <!-- Lower Cylinder Ring -->
    <path d="M34 52 v14 c0 5 11.6 9 26 9 s26 -4 26 -9 v-14" />
    <!-- Bottom Cylinder Ring -->
    <path d="M34 66 v14 c0 5 11.6 9 26 9 s26 -4 26 -9 v-14" fill="#0c1829" fill-opacity="0.6" />
  </g>

  <!-- Query Lightning Pulse Core -->
  <polygon points="61,46 51,61 58,61 53,74 69,57 61,57" fill="#38bdf8" filter="url(#dbmsGlow)" />
  
  <!-- Index Node Accents -->
  <circle cx="28" cy="60" r="3" fill="#38bdf8" />
  <circle cx="92" cy="60" r="3" fill="#34d399" />
  <circle cx="60" cy="94" r="3" fill="#38bdf8" />
