name: CodeSkill CI/CD — Immutable ECR Build & Auto Scaling Rollout

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Target service to build and deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
      image_tag:
        description: 'Specific image tag to deploy or rollback to (leave blank for commit SHA)'
        required: false
        default: ''

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 239939507154.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: codeskill-prod-frontend
  BACKEND_REPO: codeskill-prod-backend
  FRONTEND_ASG: codeskill-frontend-asg
  BACKEND_ASG: codeskill-backend-asg
  FRONTEND_TG: codeskill-prod-tg
  ASG_INSTANCE_WARMUP: 120
  ASG_MIN_HEALTHY_PERCENTAGE: 0
  ASG_MAX_HEALTHY_PERCENTAGE: 100

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Parallel Validation & Automated Tests (Independent Runner Jobs)
  # ============================================================================
  validate-backend:
    name: Validate Backend (Lint, Build, Test)
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend-nestjs/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend-nestjs
        run: npm ci --legacy-peer-deps

      - name: Backend Lint Check
        working-directory: ./backend-nestjs
        run: npx eslint --quiet "{src,apps,libs,test}/**/*.ts"

      - name: Backend Build & Type Check
        working-directory: ./backend-nestjs
        run: npm run build

      - name: Backend Runtime Module Validation
        working-directory: ./backend-nestjs
        run: npm run test:startup

      - name: Backend Unit & Concurrency Tests
        working-directory: ./backend-nestjs
        run: npm test -- --maxWorkers=2

  validate-frontend:
    name: Validate Frontend (Lint, Type Check & Tests)
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend-v2
        run: npm ci --legacy-peer-deps

      - name: Frontend Lint Check
        working-directory: ./frontend-v2
        run: npm run lint -- --quiet

      - name: Frontend Type Check
        working-directory: ./frontend-v2
        run: npm run typecheck

      - name: Frontend Unit Tests
        working-directory: ./frontend-v2
        run: npm test -- --maxWorkers=2

  # ============================================================================
  # 2. Parallel Docker Image Builds (Independent Runner Jobs with Scoped Caches)
  # ============================================================================
  build-backend:
    name: Build & Push Backend Docker Image
    needs: validate-backend
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      deployment_tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Deployment Tag
        id: determine-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials (OIDC / Access Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-nestjs
          file: ./backend-nestjs/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ steps.determine-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Push Frontend Docker Image
    needs: validate-frontend
    if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      deployment_tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Deployment Tag
        id: determine-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials (OIDC / Access Keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-v2
          file: ./frontend-v2/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ steps.determine-tag.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # 3. Rolling Auto Scaling Instance Refresh with Health Verification
  # ============================================================================
  rollout:
    name: Rolling Auto Scaling Rollout & Verification
    needs: [build-backend, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Record Deployment Metadata
        run: |
          echo "### Deployment Execution Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Service** | \`${{ github.event.inputs.service || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image Tag** | \`${{ needs.build-backend.outputs.deployment_tag || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image Tag** | \`${{ needs.build-frontend.outputs.deployment_tag || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ASG Warmup Period** | \`${{ env.ASG_INSTANCE_WARMUP }}s\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`$(date -u +"%Y-%m-%dT%H:%M:%SZ")\` |" >> $GITHUB_STEP_SUMMARY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Frontend Auto Scaling Rolling Refresh
        id: refresh-frontend
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          asg="${{ env.FRONTEND_ASG }}"
          read -r latest_status latest_id < <(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$asg" \
            --region "${{ env.AWS_REGION }}" \
            --query 'InstanceRefreshes[0].[Status,InstanceRefreshId]' \
            --output text || echo "None None")

          case "$latest_status" in
            Successful|Failed|Cancelled|RollbackSuccessful|RollbackFailed|None|"")
              echo "No active instance refresh blocking ${asg} (latest: ${latest_status:-none})"
              ;;
            *)
              echo "Found active instance refresh ${latest_id} for ${asg} (status: ${latest_status}). Cancelling to roll out latest build..."
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" || true
              for i in {1..30}; do
                st=$(aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$asg" \
                  --instance-refresh-ids "$latest_id" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'InstanceRefreshes[0].Status' --output text || echo "")
                echo "Waiting for refresh ${latest_id} cancellation (status: $st)..."
                case "$st" in
                  Cancelled|Failed|Successful|RollbackSuccessful|RollbackFailed|"")
                    break
                    ;;
                esac
                sleep 5
              done
              ;;
          esac

          echo "Initiating rolling instance refresh for ${asg}..."
          read -r lt_id lt_version < <(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$asg" --region "${{ env.AWS_REGION }}" --query 'AutoScalingGroups[0].LaunchTemplate.[LaunchTemplateId,Version]' --output text || true)
          desired=""
          if [[ -n "$lt_id" && -n "$lt_version" && "$lt_version" != "None" ]]; then
            desired=$(jq -cn --arg id "$lt_id" --arg version "$lt_version" '{LaunchTemplate:{LaunchTemplateId:$id,Version:$version}}')
          fi

          refresh_id=""
          for attempt in {1..12}; do
            cmd=(aws autoscaling start-instance-refresh --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" --query 'InstanceRefreshId' --output text)
            if [[ -n "$desired" ]]; then
              cmd+=(--desired-configuration "$desired" --preferences "{\"MinHealthyPercentage\": ${{ env.ASG_MIN_HEALTHY_PERCENTAGE }}, \"MaxHealthyPercentage\": ${{ env.ASG_MAX_HEALTHY_PERCENTAGE }}, \"InstanceWarmup\": ${{ env.ASG_INSTANCE_WARMUP }}, \"SkipMatching\": false, \"AutoRollback\": true}")
            else
              cmd+=(--preferences "{\"MinHealthyPercentage\": ${{ env.ASG_MIN_HEALTHY_PERCENTAGE }}, \"MaxHealthyPercentage\": ${{ env.ASG_MAX_HEALTHY_PERCENTAGE }}, \"InstanceWarmup\": ${{ env.ASG_INSTANCE_WARMUP }}, \"SkipMatching\": false, \"AutoRollback\": false}")
            fi

            out=$("${cmd[@]}" 2>&1) && { refresh_id="$out"; break; }
            if echo "$out" | grep -qi "InstanceRefreshInProgress"; then
              echo "Instance refresh state still settling, retrying in 5s (attempt $attempt/12)..."
              sleep 5
            else
              echo "$out" >&2
              exit 1
            fi
          done

          if [[ -z "$refresh_id" ]]; then
            echo "Failed to initiate instance refresh for ${asg}" >&2
            exit 1
          fi

          echo "Initiated ${asg} refresh ${refresh_id}"
          echo "refresh_id=$refresh_id" >> "$GITHUB_OUTPUT"

      - name: Trigger Backend Auto Scaling Rolling Refresh
        id: refresh-backend
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'backend' || github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          asg="${{ env.BACKEND_ASG }}"
          read -r latest_status latest_id < <(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$asg" \
            --region "${{ env.AWS_REGION }}" \
            --query 'InstanceRefreshes[0].[Status,InstanceRefreshId]' \
            --output text || echo "None None")

          case "$latest_status" in
            Successful|Failed|Cancelled|RollbackSuccessful|RollbackFailed|None|"")
              echo "No active instance refresh blocking ${asg} (latest: ${latest_status:-none})"
              ;;
            *)
              echo "Found active instance refresh ${latest_id} for ${asg} (status: ${latest_status}). Cancelling to roll out latest build..."
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" || true
              for i in {1..30}; do
                st=$(aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$asg" \
                  --instance-refresh-ids "$latest_id" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'InstanceRefreshes[0].Status' --output text || echo "")
                echo "Waiting for refresh ${latest_id} cancellation (status: $st)..."
                case "$st" in
                  Cancelled|Failed|Successful|RollbackSuccessful|RollbackFailed|"")
                    break
                    ;;
                esac
                sleep 5
              done
              ;;
          esac

          echo "Initiating rolling instance refresh for ${asg}..."
          read -r lt_id lt_version < <(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$asg" --region "${{ env.AWS_REGION }}" --query 'AutoScalingGroups[0].LaunchTemplate.[LaunchTemplateId,Version]' --output text || true)
          desired=""
          if [[ -n "$lt_id" && -n "$lt_version" && "$lt_version" != "None" ]]; then
            desired=$(jq -cn --arg id "$lt_id" --arg version "$lt_version" '{LaunchTemplate:{LaunchTemplateId:$id,Version:$version}}')
          fi

          refresh_id=""
          for attempt in {1..12}; do
            cmd=(aws autoscaling start-instance-refresh --auto-scaling-group-name "$asg" --region "${{ env.AWS_REGION }}" --query 'InstanceRefreshId' --output text)
            if [[ -n "$desired" ]]; then
              cmd+=(--desired-configuration "$desired" --preferences "{\"MinHealthyPercentage\": ${{ env.ASG_MIN_HEALTHY_PERCENTAGE }}, \"MaxHealthyPercentage\": ${{ env.ASG_MAX_HEALTHY_PERCENTAGE }}, \"InstanceWarmup\": ${{ env.ASG_INSTANCE_WARMUP }}, \"SkipMatching\": false, \"AutoRollback\": true}")
            else
              cmd+=(--preferences "{\"MinHealthyPercentage\": ${{ env.ASG_MIN_HEALTHY_PERCENTAGE }}, \"MaxHealthyPercentage\": ${{ env.ASG_MAX_HEALTHY_PERCENTAGE }}, \"InstanceWarmup\": ${{ env.ASG_INSTANCE_WARMUP }}, \"SkipMatching\": false, \"AutoRollback\": false}")
            fi

            out=$("${cmd[@]}" 2>&1) && { refresh_id="$out"; break; }
            if echo "$out" | grep -qi "InstanceRefreshInProgress"; then
              echo "Instance refresh state still settling, retrying in 5s (attempt $attempt/12)..."
              sleep 5
            else
              echo "$out" >&2
              exit 1
            fi
          done

          if [[ -z "$refresh_id" ]]; then
            echo "Failed to initiate instance refresh for ${asg}" >&2
            exit 1
          fi

          echo "Initiated ${asg} refresh ${refresh_id}"
          echo "refresh_id=$refresh_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Auto Scaling refreshes to finish
        env:
          FRONTEND_REFRESH_ID: ${{ steps['refresh-frontend'].outputs.refresh_id }}
          BACKEND_REFRESH_ID: ${{ steps['refresh-backend'].outputs.refresh_id }}
        run: |
          set -euo pipefail
          refreshes=()
          if [ -n "$FRONTEND_REFRESH_ID" ]; then
            refreshes+=("${{ env.FRONTEND_ASG }}:$FRONTEND_REFRESH_ID")
          fi
          if [ -n "$BACKEND_REFRESH_ID" ]; then
            refreshes+=("${{ env.BACKEND_ASG }}:$BACKEND_REFRESH_ID")
          fi

          for attempt in {1..80}; do
            pending=0
            for refresh in "${refreshes[@]}"; do
              asg="${refresh%%:*}"
              refresh_id="${refresh#*:}"
              info=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$asg" \
                --instance-refresh-ids "$refresh_id" \
                --region "${{ env.AWS_REGION }}" \
                --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' --output text || echo "Unknown 0 Unknown")
              read -r status pct reason <<< "$info"
              echo "[Attempt $attempt/80] $asg ($refresh_id): status=$status, progress=${pct:-0}%, reason=${reason:-none}"
              if [ "$attempt" -gt 4 ] && [ "${pct:-0}" -eq 0 ] && [ $((attempt % 4)) -eq 0 ]; then
                act=$(aws autoscaling describe-scaling-activities --auto-scaling-group-name "$asg" --max-items 1 --region "${{ env.AWS_REGION }}" --query 'Activities[0].[StatusCode,StatusMessage]' --output text 2>/dev/null || echo "")
                if [ -n "$act" ]; then
                  echo "  [Diagnostic] Latest $asg scaling event: $act"
                fi
              fi
              case "$status" in
                Successful) ;;
                Pending|InProgress|Baking|CheckpointDelay) pending=1 ;;
                *) echo "$asg instance refresh did not succeed (status: $status, reason: $reason)" >&2; exit 1 ;;
              esac
            done
            if [ "$pending" -eq 0 ]; then
              echo "All Auto Scaling instance refreshes completed successfully."
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "Timed out waiting for Auto Scaling instance refreshes after 20 minutes." >&2
              for refresh in "${refreshes[@]}"; do
                asg="${refresh%%:*}"
                echo "=== Recent Scaling Activities for $asg ==="
                aws autoscaling describe-scaling-activities --auto-scaling-group-name "$asg" --max-items 5 --region "${{ env.AWS_REGION }}" --output table 2>/dev/null || true
              done
              exit 1
            fi
            sleep 15
          done

      - name: Verify Live Production Readiness Checks
        run: |
          echo "Polling production domain readiness endpoints..."
          for i in {1..20}; do
            STATUS_FE=$(curl -s -o /dev/null -w "%{http_code}" https://codeskill.novaserve.cloud/health/ready || echo "000")
            STATUS_BE=$(curl -s -o /dev/null -w "%{http_code}" https://codeskill.novaserve.cloud/api/health/ready || echo "000")
            echo "Attempt $i: Frontend Readiness HTTP $STATUS_FE, Backend Readiness HTTP $STATUS_BE"
            if [ "$STATUS_FE" = "200" ] && [ "$STATUS_BE" = "200" ]; then
              echo "Both Frontend and Backend passed live readiness verification."
              exit 0
            fi
            sleep 15
          done
          echo "Live readiness verification did not return 200 within timeout." >&2
          exit 1

      - name: Verify Skill Development page is deployed
        if: github.event.inputs.service == 'all' || github.event.inputs.service == 'frontend' || github.event_name == 'push'
        run: |
          echo "Checking that the Skill Development page is served from production..."
          PAGE_CONTENT=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://codeskill.novaserve.cloud/skill-development?deploy-check=${GITHUB_SHA}")
          if ! grep -q "Our Sincere Gratitude" <<< "$PAGE_CONTENT"; then
            echo "The production route responded but did not contain the Skill Development page content." >&2
            exit 1
          fi
          echo "Skill Development page is live."
