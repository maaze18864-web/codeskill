<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="genaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="genaiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0c0d18" stroke="url(#genaiBg)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#genaiBg)" fill-opacity="0.14" />
  <!-- Transformer Attention Rings -->
  <circle cx="60" cy="60" r="32" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7" />
  <circle cx="60" cy="60" r="22" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.8" />
  <!-- Center Core Star -->
  <polygon points="60,38 65,53 80,60 65,67 60,82 55,67 40,60 55,53" fill="url(#genaiBg)" filter="url(#genaiGlow)" />
  <circle cx="60" cy="60" r="4" fill="#ffffff" />
  <!-- Orbiting Nodes -->
  <circle cx="60" cy="28" r="3.5" fill="#38bdf8" />
  <circle cx="92" cy="60" r="3.5" fill="#f472b6" />
  <circle cx="60" cy="92" r="3.5" fill="#a78bfa" />
  <circle cx="28" cy="60" r="3.5" fill="#38bdf8" />
</svg>
