<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0d0d14" stroke="url(#aiBg)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#aiBg)" fill-opacity="0.12" />
  <!-- Neural Network Nodes -->
  <g stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="42" y1="46" x2="60" y2="34" />
    <line x1="60" y1="34" x2="78" y2="46" />
    <line x1="42" y1="46" x2="42" y2="74" />
    <line x1="78" y1="46" x2="78" y2="74" />
    <line x1="42" y1="74" x2="60" y2="86" />
    <line x1="78" y1="74" x2="60" y2="86" />
    <line x1="42" y1="46" x2="60" y2="60" />
    <line x1="78" y1="46" x2="60" y2="60" />
    <line x1="42" y1="74" x2="60" y2="60" />
    <line x1="78" y1="74" x2="60" y2="60" />
  </g>
  <!-- Node Circles -->
  <circle cx="60" cy="34" r="5" fill="#38bdf8" />
  <circle cx="42" cy="46" r="4.5" fill="#a78bfa" />
  <circle cx="78" cy="46" r="4.5" fill="#a78bfa" />
  <circle cx="60" cy="60" r="6" fill="#f43f5e" filter="url(#aiGlow)" />
  <circle cx="42" cy="74" r="4.5" fill="#38bdf8" />
  <circle cx="78" cy="74" r="4.5" fill="#38bdf8" />
  <circle cx="60" cy="86" r="5" fill="#a78bfa" />
</svg>
