<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="javaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="javaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#120c0a" stroke="url(#javaBg)" stroke-width="3" />
  <circle cx="60" cy="60" r="46" fill="url(#javaBg)" fill-opacity="0.12" />

  <!-- Coffee Cup / JVM Vessel Body -->
  <path d="M40 52 h34 v20 c0 9 -7 16 -17 16 s-17 -7 -17 -16 z" fill="#1c110e" stroke="url(#javaBg)" stroke-width="2.5" />
  <!-- Cup Handle -->
  <path d="M74 56 h6 c4 0 7 3 7 7 s-3 7 -7 7 h-6" fill="none" stroke="url(#javaBg)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Saucer Base -->
  <path d="M34 92 h46" stroke="#f97316" stroke-width="3" stroke-linecap="round" />

  <!-- Rising Steam Waves -->
  <path d="M49 44 c-2 -4 2 -7 0 -11" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" filter="url(#javaGlow)" />
  <path d="M57 42 c-3 -4 2 -7 0 -12" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" filter="url(#javaGlow)" />
  <path d="M65 44 c-2 -4 2 -7 0 -11" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" filter="url(#javaGlow)" />

  <!-- Duke Champion Star Sparkle -->
  <polygon points="57,60 59,64 64,65 60,68 61,73 57,70 53,73 54,68 50,65 55,64" fill="#fbbf24" />
